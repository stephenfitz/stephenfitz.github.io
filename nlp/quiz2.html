    <script>
        var questions = [
            {
                topic: "Spectral Word Embeddings",
                question: "Why does one-hot encoding fail to capture word similarity?",
                options: [
                    "Because one-hot vectors are too short to represent meaning",
                    "Because all pairs of distinct one-hot vectors are orthogonal, making every pair of words equidistant",
                    "Because one-hot vectors only work for verbs, not nouns",
                    "Because one-hot vectors assign negative values to dissimilar words",
                    "Because one-hot encoding requires more data than dense representations"
                ],
                correct: 1
            },
            {
                topic: "Spectral Word Embeddings",
                question: "What does the distributional hypothesis state?",
                options: [
                    "Words that are spelled similarly have similar meanings",
                    "Words that appear in similar contexts tend to have similar meanings",
                    "Words with the same part of speech always have similar meanings",
                    "High-frequency words carry more meaning than low-frequency words",
                    "Words in the same sentence always have related meanings"
                ],
                correct: 1
            },
            {
                topic: "Spectral Word Embeddings",
                question: "In the Dice coefficient \\(D(w^{(i)}, w^{(j)}) = 2 \\times \\frac{|C(w^{(i)}) \\cap C(w^{(j)})|}{|C(w^{(i)})| + |C(w^{(j)})|}\\), what value does \\(D\\) take when the two words have identical context sets?",
                options: [
                    "0",
                    "0.5",
                    "1.0",
                    "2.0",
                    "It depends on the size of the context sets"
                ],
                correct: 2
            },
            {
                topic: "Spectral Word Embeddings",
                question: "The graph Laplacian is defined as \\(L = D - W\\). What does the quadratic form \\(\\mathbf{f}^\\top L \\mathbf{f}\\) measure?",
                options: [
                    "The total number of edges in the graph",
                    "The shortest path between the two most dissimilar words",
                    "The total variation of \\(\\mathbf{f}\\) over the graph, weighted by edge strength",
                    "The determinant of the adjacency matrix",
                    "The average word frequency in the corpus"
                ],
                correct: 2
            },
            {
                topic: "Spectral Word Embeddings",
                question: "Why is the constant vector \\(\\mathbf{1}\\) an eigenvector of the graph Laplacian \\(L\\) with eigenvalue 0?",
                options: [
                    "Because \\(L\\) is always the zero matrix",
                    "Because a constant function has zero variation across all edges, so \\(\\mathbf{1}^\\top L \\mathbf{1} = 0\\)",
                    "Because the Laplacian is defined to have all eigenvalues equal to zero",
                    "Because the constant vector is orthogonal to all other eigenvectors",
                    "Because the degree matrix cancels itself out"
                ],
                correct: 1
            },
            {
                topic: "Spectral Word Embeddings",
                question: "In spectral embedding, why is the \\(D\\)-weighted inner product \\(\\mathbf{f}^\\top D \\mathbf{f} = 1\\) used as a normalization constraint instead of \\(\\mathbf{f}^\\top \\mathbf{f} = 1\\)?",
                options: [
                    "It makes the eigenvalue computation faster",
                    "It accounts for vertex degree, preventing the embedding from being dominated by rare words",
                    "It ensures the eigenvectors are always orthogonal",
                    "It forces all embedding dimensions to have equal variance",
                    "It eliminates the need for the graph Laplacian"
                ],
                correct: 1
            },
            {
                topic: "Spectral Word Embeddings",
                question: "What is the Fiedler vector?",
                options: [
                    "The eigenvector of \\(L\\) with the largest eigenvalue",
                    "The eigenvector corresponding to eigenvalue zero",
                    "The first nontrivial generalized eigenvector (corresponding to \\(\\lambda_2\\)), providing the best one-dimensional embedding",
                    "The average of all eigenvectors of the Laplacian",
                    "The eigenvector that maximizes the quadratic form"
                ],
                correct: 2
            },
            {
                topic: "Spectral Word Embeddings",
                question: "For a \\(k\\)-dimensional spectral embedding, which eigenvectors of the generalized problem \\(L\\mathbf{f} = \\lambda D\\mathbf{f}\\) are used?",
                options: [
                    "The \\(k\\) eigenvectors with the largest eigenvalues",
                    "The first \\(k\\) eigenvectors including the one with eigenvalue 0",
                    "The \\(k\\) eigenvectors corresponding to the \\(k\\) smallest nonzero eigenvalues",
                    "A random subset of \\(k\\) eigenvectors",
                    "The eigenvectors whose eigenvalues are closest to 1"
                ],
                correct: 2
            },
            {
                topic: "Spectral Word Embeddings",
                question: "Which of the following is NOT an advantage of spectral embedding over neural embedding methods?",
                options: [
                    "Mathematical transparency (no training loops or hyperparameters)",
                    "Theoretical optimality guarantees from spectral graph theory",
                    "Interpretable dimensions corresponding to specific eigenvectors",
                    "Scalability to very large vocabularies without forming the full similarity matrix",
                    "Unique solution up to trivial rotations and sign flips"
                ],
                correct: 3
            },
            {
                topic: "GloVe",
                question: "What is the key insight that motivates the GloVe objective function?",
                options: [
                    "Raw word frequencies are the best signal for learning embeddings",
                    "Co-occurrence probability ratios encode word relationships more cleanly than raw probabilities",
                    "Neural network predictions are always superior to count-based methods",
                    "Singular value decomposition is the optimal matrix factorization",
                    "Pointwise mutual information should be maximized"
                ],
                correct: 1

        // Shuffle answer options so the correct answer isn't always B/C
        function shuffleOptions() {
            for (var q = 0; q < questions.length; q++) {
                var opts = questions[q].options;
                var correctText = opts[questions[q].correct];
                for (var i = opts.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var tmp = opts[i];
                    opts[i] = opts[j];
                    opts[j] = tmp;
                }
                questions[q].correct = opts.indexOf(correctText);
            }
        }
        shuffleOptions();

        var currentIndex = 0;
        var answers = new Array(questions.length).fill(null);
        var submitted = new Array(questions.length).fill(false);
        var score = 0;

        // Theme management
        var savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.body.classList.add('dark');
        }

        function toggleTheme() {
            var isDark = document.body.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                document.body.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        function renderQuestion() {
            var q = questions[currentIndex];
            document.getElementById('cardCounter').textContent = 'Question ' + (currentIndex + 1) + ' of ' + questions.length;
            document.getElementById('topicTag').textContent = q.topic;
            document.getElementById('questionText').innerHTML = q.question;

            var answeredCount = submitted.filter(function(s) { return s; }).length;
            document.getElementById('scoreDisplay').textContent = 'Score: ' + score + ' / ' + answeredCount + ' answered';

            var progress = (answeredCount / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            var optionsList = document.getElementById('optionsList');
            var letters = ['A', 'B', 'C', 'D', 'E'];
            var html = '';

            for (var i = 0; i < q.options.length; i++) {
                var extraClass = '';
                var isDisabled = submitted[currentIndex];

                if (isDisabled) {
                    extraClass = ' disabled';
                    if (i === q.correct) {
                        extraClass += ' correct';
                    } else if (i === answers[currentIndex] && i !== q.correct) {
                        extraClass += ' incorrect';
                    }
                } else if (answers[currentIndex] === i) {
                    extraClass = ' selected';
                }

                html += '<li class="option-item">';
                html += '<label class="option-label' + extraClass + '" onclick="selectOption(' + i + ')">';
                html += '<span class="option-letter">' + letters[i] + '</span>';
                html += '<span class="option-text">' + q.options[i] + '</span>';
                html += '</label>';
                html += '</li>';
            }

            optionsList.innerHTML = html;

            // Submit button state
            var submitBtn = document.getElementById('submitBtn');
            if (submitted[currentIndex]) {
                submitBtn.style.display = 'none';
            } else {
                submitBtn.style.display = 'inline-block';
                submitBtn.disabled = answers[currentIndex] === null;
            }

            // Result feedback
            var feedback = document.getElementById('resultFeedback');
            if (submitted[currentIndex]) {
                if (answers[currentIndex] === q.correct) {
                    feedback.textContent = 'Correct!';
                    feedback.className = 'result-feedback correct-text';
                } else {
                    feedback.textContent = 'Incorrect. The correct answer is ' + letters[q.correct] + '.';
                    feedback.className = 'result-feedback incorrect-text';
                }
            } else {
                feedback.textContent = '';
                feedback.className = 'result-feedback';
            }

            // Nav buttons
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === questions.length - 1;

            // Typeset MathJax
            if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('quizCard')]).catch(function(err) {
                    console.log('MathJax typeset error:', err);
                });
            }
        }

        function selectOption(index) {
            if (submitted[currentIndex]) return;
            answers[currentIndex] = index;
            renderQuestion();
        }

        function submitAnswer() {
            if (answers[currentIndex] === null || submitted[currentIndex]) return;
            submitted[currentIndex] = true;

            if (answers[currentIndex] === questions[currentIndex].correct) {
                score++;
            }

            renderQuestion();

            // Check if all questions are answered
            var allAnswered = submitted.every(function(s) { return s; });
            if (allAnswered) {
                setTimeout(showFinalResults, 800);
            }
        }

        function showFinalResults() {
            document.getElementById('quizArea').style.display = 'none';
            var results = document.getElementById('finalResults');
            results.style.display = 'block';

            var pct = Math.round((score / questions.length) * 100);
            document.getElementById('finalScore').textContent = score + ' / ' + questions.length + ' (' + pct + '%)';

            var msg = '';
            if (pct === 100) {
                msg = 'Perfect score! You have an excellent grasp of the material.';
            } else if (pct >= 80) {
                msg = 'Great job! You have a strong understanding of the core concepts.';
            } else if (pct >= 60) {
                msg = 'Good effort! Consider reviewing the articles on topics you missed.';
            } else if (pct >= 40) {
                msg = 'You might want to revisit some of the articles before trying again.';
            } else {
                msg = 'Consider re-reading the articles and trying the quiz again.';
            }
            document.getElementById('finalMessage').textContent = msg;
        }

        function retakeQuiz() {
            currentIndex = 0;
            answers = new Array(questions.length).fill(null);
            submitted = new Array(questions.length).fill(false);
            score = 0;
            shuffleOptions();

            document.getElementById('finalResults').style.display = 'none';
            document.getElementById('quizArea').style.display = 'block';
            renderQuestion();
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                prevQuestion();
            } else if (e.key === 'ArrowRight') {
                nextQuestion();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (!submitted[currentIndex] && answers[currentIndex] !== null) {
                    submitAnswer();
                }
            }
        });

        // Initial render
        renderQuestion();
    </script>
