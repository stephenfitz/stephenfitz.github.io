<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text Encoding and Tokenization — Flashcards</title>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* ── Light theme (default) ── */
        :root {
            --bg: #f5f5f5;
            --body-bg: white;
            --text: #2a2a2a;
            --text-secondary: #555;
            --card-bg: white;
            --card-border: #ddd;
            --card-shadow: rgba(0,0,0,0.12);
            --btn-bg: #e8e8e8;
            --btn-hover: #ddd;
            --btn-text: #2a2a2a;
            --link-color: #1a5276;
            --toggle-bg: #ccc;
            --toggle-knob: white;
            --card-front-bg: #fafafa;
            --card-back-bg: #f0f7f0;
        }

        /* ── Dark theme ── */
        [data-theme="dark"] {
            --bg: #1a1a1a;
            --body-bg: #2a2a2a;
            --text: #d4d4d4;
            --text-secondary: #999;
            --card-bg: #333;
            --card-border: #444;
            --card-shadow: rgba(0,0,0,0.4);
            --btn-bg: #444;
            --btn-hover: #555;
            --btn-text: #d4d4d4;
            --link-color: #5dade2;
            --toggle-bg: #555;
            --toggle-knob: #222;
            --card-front-bg: #363636;
            --card-back-bg: #2f3a2f;
        }

        html {
            background-color: var(--bg);
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 12pt;
            line-height: 1.6;
            color: var(--text);
            max-width: 850px;
            margin: 2rem auto;
            padding: 2rem 3rem 3rem;
            background-color: var(--body-bg);
            box-shadow: 0 2px 8px var(--card-shadow);
            border-radius: 4px;
        }

        /* ── Header ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
            color: var(--text);
        }

        .article-link {
            color: var(--link-color);
            text-decoration: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 0.9rem;
        }

        .article-link:hover {
            text-decoration: underline;
        }

        /* ── Theme toggle ── */
        .theme-toggle {
            position: relative;
            width: 60px;
            height: 30px;
            flex-shrink: 0;
        }

        .theme-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--toggle-bg);
            border-radius: 30px;
            transition: background-color 0.3s;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            height: 24px;
            width: 24px;
            left: 3px;
            bottom: 3px;
            background-color: var(--toggle-knob);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .theme-toggle input:checked + .toggle-slider::before {
            transform: translateX(30px);
        }

        .toggle-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            pointer-events: none;
            z-index: 1;
            line-height: 1;
        }

        .toggle-icon.sun {
            left: 7px;
        }

        .toggle-icon.moon {
            right: 7px;
        }

        /* ── Card scene ── */
        .card-scene {
            perspective: 1000px;
            width: 100%;
            max-width: 640px;
            min-height: 320px;
            margin: 0 auto 1.5rem;
            cursor: pointer;
        }

        .card {
            position: relative;
            width: 100%;
            min-height: 320px;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            min-height: 320px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 2.5rem;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            box-shadow: 0 4px 16px var(--card-shadow);
            text-align: center;
        }

        .card-front {
            background-color: var(--card-front-bg);
        }

        .card-back {
            background-color: var(--card-back-bg);
            transform: rotateY(180deg);
        }

        .card-label {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .card-front .card-text {
            font-size: 1.2rem;
            line-height: 1.5;
            font-weight: 500;
        }

        .card-back .card-text {
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .card-hint {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 1.2rem;
        }

        /* ── Controls ── */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .controls button {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 0.9rem;
            padding: 0.5rem 1.2rem;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            transition: background-color 0.2s;
            user-select: none;
        }

        .controls button:hover {
            background-color: var(--btn-hover);
        }

        .controls button:active {
            transform: scale(0.97);
        }

        .card-counter {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 0.9rem;
            color: var(--text-secondary);
            min-width: 90px;
            text-align: center;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            body {
                margin: 0.5rem;
                padding: 1rem 1.2rem 1.5rem;
            }

            .header h1 {
                font-size: 1.2rem;
            }

            .card-scene {
                min-height: 280px;
            }

            .card, .card-face {
                min-height: 280px;
            }

            .card-face {
                padding: 1.5rem 1.2rem;
            }

            .card-front .card-text {
                font-size: 1.05rem;
            }

            .card-back .card-text {
                font-size: 0.95rem;
            }

            .controls {
                gap: 0.6rem;
            }

            .controls button {
                padding: 0.45rem 0.9rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div>
            <h1>Text Encoding and Tokenization &mdash; Flashcards</h1>
            <a href="text_encoding_and_tokenization-light.html" class="article-link" data-article="text_encoding_and_tokenization">&larr; Back to article</a>
        </div>
        <label class="theme-toggle" title="Toggle dark/light theme">
            <input type="checkbox" id="theme-switch">
            <span class="toggle-slider"></span>
            <span class="toggle-icon sun">&#9728;</span>
            <span class="toggle-icon moon">&#9790;</span>
        </label>
    </div>

    <!-- Flashcard -->
    <div class="card-scene" id="card-scene">
        <div class="card" id="card">
            <div class="card-face card-front">
                <div class="card-label">Question</div>
                <div class="card-text" id="front-text"></div>
                <div class="card-hint">Click to reveal answer</div>
            </div>
            <div class="card-face card-back">
                <div class="card-label">Answer</div>
                <div class="card-text" id="back-text"></div>
                <div class="card-hint">Click to return to question</div>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button id="prev-btn">&larr; Prev</button>
        <span class="card-counter" id="card-counter">Card 1 of 25</span>
        <button id="next-btn">Next &rarr;</button>
        <button id="shuffle-btn">Shuffle</button>
    </div>

    <script>
    (function () {
        /* ── Flashcard data ── */
        const flashcards = [
            {
                front: "What is ASCII?",
                back: "American Standard Code for Information Interchange (1960s). Uses 7 bits to represent 128 characters: control characters (0\u201331), printable characters (32\u2013126), and delete (127). Works for English but cannot represent accented characters, non-Latin scripts, or emoji."
            },
            {
                front: "What is Unicode?",
                back: "A universal character set that assigns a unique code point (U+XXXX) to every character in every writing system. Currently defines over 150,000 characters across 161 scripts. Code space extends to U+10FFFF (over 1.1 million possible), organized into 17 planes of 65,536 each."
            },
            {
                front: "What is UTF-8?",
                back: "A variable-width encoding using 1\u20134 bytes per character, backward compatible with ASCII. Single byte for ASCII (0xxxxxxx), 2 bytes for U+0080\u201307FF, 3 bytes for U+0800\u2013FFFF, 4 bytes for U+10000\u201310FFFF. Over 98% of websites use UTF-8."
            },
            {
                front: "Why does UTF-8 dominate?",
                back: "ASCII compatibility, efficiency for Latin text, self-synchronizing (can find character boundaries from any byte), no byte-order issues (unlike UTF-16/32), and invalid sequences are detectable."
            },
            {
                front: "What is UTF-32?",
                back: "A fixed-width encoding using exactly 4 bytes per character. Simple (random access at byte 4n) but wasteful \u2014 ASCII text uses 4\u00d7 the space needed. Not backward compatible with ASCII."
            },
            {
                front: "What is UTF-16?",
                back: "Variable-width encoding: 2 bytes for BMP characters (U+0000\u2013FFFF), 4 bytes for others using surrogate pairs. Used internally by Java, JavaScript, and Windows. Designed when Unicode was expected to fit in 16 bits."
            },
            {
                front: "How does UTF-8 encode '\u00e9' (U+00E9)?",
                back: "Binary 0xE9 = 11101001 (needs 8 bits \u2192 2-byte encoding). Template: 110xxxxx 10xxxxxx. Fill in: 11000011 10101001 = C3 A9."
            },
            {
                front: "What is the Brown Corpus?",
                back: "The first major machine-readable corpus of English (1961). About 1 million words from 500 texts across 15 genres. Groundbreaking for its time, now tiny by modern standards."
            },
            {
                front: "What is the Penn Treebank?",
                back: "~1 million words of Wall Street Journal text with syntactic annotations (1993). Standard benchmark for parsing and language modeling through the 2000s."
            },
            {
                front: "How large are modern LLM training datasets compared to classical corpora?",
                back: "1,000\u201310,000\u00d7 larger. Classical: millions of words. Modern: trillions of tokens. GPT-4 class models reportedly trained on over 10 trillion tokens. Shifted from curated corpora to filtered web crawls."
            },
            {
                front: "What are the three levels of tokenization?",
                back: "Character-level (~100\u2013300 vocab, very long sequences), Word-level (huge vocab 100K+, can\u2019t handle unknown words), Subword-level (30K\u2013100K vocab, common words intact, rare words decomposed). Modern LLMs use subword."
            },
            {
                front: "What is Byte-Pair Encoding (BPE)?",
                back: "Originally a compression algorithm (Gage, 1994), adapted for NLP (Sennrich, 2016). Training: start with characters/bytes, repeatedly merge the most frequent adjacent pair. Inference: apply learned merges in order to new text."
            },
            {
                front: "Walk through BPE merging for \u2018low\u2019 corpus.",
                back: "Start with characters {l,o,w,_,...}. Step 1: Most frequent pair \u2018l o\u2019 (7) \u2192 merge to \u2018lo\u2019. Step 2: \u2018lo w\u2019 (7) \u2192 \u2018low\u2019. Step 3: \u2018e r\u2019 (6) \u2192 \u2018er\u2019. Continue until desired vocabulary size."
            },
            {
                front: "How does BPE tokenize a new word like \u2018lower\u2019?",
                back: "Apply learned merges in order: l o w e r \u2192 (l o\u2192lo) lo w e r \u2192 (lo w\u2192low) low e r \u2192 (e r\u2192er) low er. Result: [\u2018low\u2019, \u2018er\u2019]. The word wasn\u2019t in training but is segmented into meaningful pieces."
            },
            {
                front: "What is byte-level BPE?",
                back: "Introduced by GPT-2: start with 256 possible byte values instead of characters. Guarantees any text can be tokenized (no unknown characters). Handles UTF-8 naturally \u2014 multilingual text without explicit Unicode handling."
            },
            {
                front: "How does WordPiece differ from BPE?",
                back: "WordPiece (used by BERT) selects merges by likelihood ratio: score(x,y) = freq(xy)/(freq(x)\u00b7freq(y)), favoring pairs that co-occur more than expected. Uses \u2018##\u2019 prefix for word continuations: \u2018tokenization\u2019 \u2192 [\u2018token\u2019, \u2018##ization\u2019]."
            },
            {
                front: "How does the Unigram tokenizer work?",
                back: "Opposite of BPE: starts with a large vocabulary and prunes. Trains a unigram language model P(t) for each token, removes tokens whose removal causes smallest decrease in corpus log-likelihood. Uses Viterbi for globally optimal tokenization."
            },
            {
                front: "What is SentencePiece?",
                back: "A tokenizer library implementing both BPE and Unigram. Treats input as raw bytes/Unicode (language-independent), includes whitespace as a normal symbol, fully deterministic. Used by T5, LLaMA, XLNet."
            },
            {
                front: "What are typical vocabulary sizes for major models?",
                back: "GPT-2: 50,257 tokens. BERT: 30,522 (WordPiece). GPT-4: ~100,000. LLaMA: 32,000. Larger vocabulary = shorter sequences but more embedding parameters."
            },
            {
                front: "What tokenization artifacts can cause problems?",
                back: "Inconsistent arithmetic (\u20181000\u2019 vs \u20181001\u2019 tokenize differently), whitespace sensitivity (\u2018 hello\u2019 \u2260 \u2018hello\u2019), language bias (non-English fragmented into more tokens), prompt sensitivity (minor changes shift token boundaries)."
            },
            {
                front: "What are special tokens in tokenizers?",
                back: "[PAD]: padding. [UNK]: unknown. [CLS]: classification (BERT). [SEP]: separator. [BOS]/[EOS]: beginning/end of sequence. &lt;|endoftext|&gt;: GPT\u2019s end-of-document marker."
            },
            {
                front: "What is Common Crawl?",
                back: "Petabytes of web pages crawled since 2008. Forms the base of many training datasets (C4, RefinedWeb, RedPajama). Raw crawls require extensive filtering and deduplication."
            },
            {
                front: "What is The Pile?",
                back: "An 800GB diverse dataset (2020) combining 22 sources: books, Wikipedia, GitHub, arXiv, Stack Exchange, patents, and more. Designed for research reproducibility."
            },
            {
                front: "What is the Basic Multilingual Plane (BMP)?",
                back: "Unicode Plane 0 (U+0000\u2013U+FFFF) containing the most common characters. Plane 1 has emoji and historic scripts. Plane 2 has rare CJK characters. Most everyday text uses only BMP characters."
            },
            {
                front: "What tradeoff does vocabulary size create?",
                back: "Larger vocabularies mean shorter sequences (fewer tokens per text) but more parameters in the embedding layer. There\u2019s a tradeoff between sequence length and model size."
            }
        ];

        /* ── State ── */
        let order = flashcards.map((_, i) => i);
        let current = 0;
        let flipped = false;

        /* ── DOM refs ── */
        const cardEl = document.getElementById('card');
        const frontText = document.getElementById('front-text');
        const backText = document.getElementById('back-text');
        const counter = document.getElementById('card-counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const themeSwitch = document.getElementById('theme-switch');
        const articleLink = document.querySelector('.article-link');

        /* ── Render card ── */
        function renderCard() {
            const idx = order[current];
            const card = flashcards[idx];

            /* Unflip first if needed */
            if (flipped) {
                flipped = false;
                cardEl.classList.remove('is-flipped');
            }

            frontText.innerHTML = card.front;
            backText.innerHTML = card.back;
            counter.textContent = 'Card ' + (current + 1) + ' of ' + order.length;

            /* Re-typeset MathJax */
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([frontText, backText]).catch(function () {});
            }
        }

        /* ── Flip ── */
        document.getElementById('card-scene').addEventListener('click', function () {
            flipped = !flipped;
            cardEl.classList.toggle('is-flipped');

            /* Re-typeset after flip animation completes */
            if (window.MathJax && MathJax.typesetPromise) {
                setTimeout(function () {
                    MathJax.typesetPromise([frontText, backText]).catch(function () {});
                }, 650);
            }
        });

        /* ── Navigation ── */
        prevBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            current = (current - 1 + order.length) % order.length;
            renderCard();
        });

        nextBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            current = (current + 1) % order.length;
            renderCard();
        });

        /* ── Shuffle (Fisher-Yates) ── */
        shuffleBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            for (let i = order.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                var tmp = order[i];
                order[i] = order[j];
                order[j] = tmp;
            }
            current = 0;
            renderCard();
        });

        /* ── Keyboard navigation ── */
        document.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft') {
                current = (current - 1 + order.length) % order.length;
                renderCard();
            } else if (e.key === 'ArrowRight') {
                current = (current + 1) % order.length;
                renderCard();
            } else if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipped = !flipped;
                cardEl.classList.toggle('is-flipped');
                if (window.MathJax && MathJax.typesetPromise) {
                    setTimeout(function () {
                        MathJax.typesetPromise([frontText, backText]).catch(function () {});
                    }, 650);
                }
            }
        });

        /* ── Theme ── */
        function setTheme(dark) {
            if (dark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeSwitch.checked = true;
                articleLink.href = 'text_encoding_and_tokenization-dark.html';
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeSwitch.checked = false;
                articleLink.href = 'text_encoding_and_tokenization-light.html';
            }
            try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
        }

        themeSwitch.addEventListener('change', function () {
            setTheme(this.checked);
        });

        /* Restore saved theme */
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        if (saved === 'dark') {
            setTheme(true);
        } else {
            setTheme(false);
        }

        /* ── Initial render ── */
        renderCard();
    })();
    </script>
</body>
</html>
