</head>
<body>
    <div class="header-container">
        <h1>Logistic Regression as an Interpretability Tool &mdash; Flashcards</h1>
        <div class="theme-toggle">
            <span class="toggle-label">Theme</span>
            <div class="toggle-switch" onclick="toggleTheme()">
                <div class="toggle-slider"></div>
            </div>
        </div>
    </div>

    <a href="logistic_regression_interpretability-light.html" class="back-link article-link" data-article="logistic_regression_interpretability">&larr; Back to article</a>

    <div class="card-counter" id="cardCounter">Card 1 of 25</div>

    <div class="flashcard-scene" id="flashcardScene" onclick="flipCard()">
        <div class="flashcard" id="flashcard">
            <div class="flashcard-face flashcard-front">
                <div class="face-label">Question</div>
                <div class="card-text" id="frontText"></div>
                <div class="tap-hint">Click to reveal answer</div>
            </div>
            <div class="flashcard-face flashcard-back">
                <div class="face-label">Answer</div>
                <div class="card-text" id="backText"></div>
                <div class="tap-hint">Click to see question</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="prevCard()">&larr; Previous</button>
        <button class="shuffle-btn" onclick="shuffleDeck()">Shuffle</button>
        <button id="nextBtn" onclick="nextCard()">Next &rarr;</button>
    </div>

    <footer>
        <p>Stephen Fitz &middot; 2026</p>
    </footer>

    <script>
        var cards = [
            {
                front: "Define the log-odds function of a logistic regression model and give its value.",
                back: "\\(\\ell_w(x) = \\log\\frac{p_w(x)}{1 - p_w(x)} = w^\\top x + b\\). The log-odds are a linear function of the features, because \\(\\sigma(z)/(1 - \\sigma(z)) = e^z\\)."
            },
            {
                front: "What precise meaning does coefficient \\(w_j\\) have in logistic regression?",
                back: "\\(w_j = \\frac{\\partial}{\\partial x_j}\\log\\frac{p_w(x)}{1 - p_w(x)}\\) — the partial derivative of the log-odds with respect to feature \\(x_j\\). It tells exactly how much a unit increase in \\(x_j\\) shifts the log-odds."
            },
            {
                front: "State the odds-multiplier formula and give an example.",
                back: "\\(\\text{odds}(x + \\Delta e_j)/\\text{odds}(x) = e^{\\Delta w_j}\\). For a unit increase, odds are multiplied by \\(e^{w_j}\\). Example: \\(w_j = -1\\) multiplies odds by \\(e^{-1} \\approx 0.37\\) — a 63% decrease."
            },
            {
                front: "What are the two principal settings where logistic regression is used to interpret other models?",
                back: "(1) <strong>Linear probes</strong>: fit logistic regression on a frozen deep-network representation \\(h_\\ell(x)\\) to decode what the representation encodes. (2) <strong>Surrogate models</strong>: fit LR to approximate a black-box \\(p_f(x)\\) for a local linear explanation (LIME-style)."
            },
            {
                front: "What is a linear probe, and what does high probe accuracy imply?",
                back: "A logistic regression fitted on a frozen representation: \\(P(y=1 \\mid x) = \\sigma(w^\\top h_\\ell(x) + b)\\). High accuracy implies the label is <strong>linearly encoded</strong> in that layer. The weights show which directions carry the signal."
            },
            {
                front: "Write the cross-entropy loss with soft labels \\(q \\in (0, 1)\\).",
                back: "\\(\\mathrm{CE}(q, p) = -[q\\log p + (1 - q)\\log(1 - p)]\\). This generalizes binary cross-entropy; reduces to the hard-label form when \\(q \\in \\{0, 1\\}\\)."
            },
            {
                front: "Give the cross-entropy in logit form.",
                back: "\\(\\mathrm{CE}(q, \\sigma(z)) = \\log(1 + e^z) - qz\\). The softplus \\(\\log(1 + e^z)\\) provides curvature; \\(-qz\\) is a linear tilt that shifts the minimum."
            },
            {
                front: "Derive the logit form: show \\(\\mathrm{CE}(q, \\sigma(z)) = \\log(1 + e^z) - qz\\).",
                back: "Use \\(\\log\\sigma(z) = z - \\log(1+e^z)\\) and \\(\\log(1-\\sigma(z)) = -\\log(1+e^z)\\). Then \\(-q[z-\\log(1+e^z)] - (1-q)[-\\log(1+e^z)] = -qz + \\log(1+e^z)\\)."
            },
            {
                front: "What is the stationary condition of the cross-entropy in logit form?",
                back: "\\(\\frac{d\\ell}{dz} = \\sigma(z) - q = 0 \\Rightarrow z^* = \\logit(q)\\). The optimal logit at each point is the teacher's own logit."
            },
            {
                front: "Why is the stationary condition \\(z^* = \\logit(q)\\) conceptually important?",
                back: "Fitting LR to soft labels is secretly doing <strong>function approximation in logit space</strong>: find a linear \\(w^\\top \\phi(x) + b\\) that best approximates the (nonlinear) teacher logit \\(t(x) = \\logit(q(x))\\)."
            },
            {
                front: "Taylor-expand \\(\\ell(z; q)\\) around \\(z = t = \\logit(q)\\). What are the first two derivatives?",
                back: "\\(\\ell'(t) = \\sigma(t) - q = 0\\) (optimum). \\(\\ell''(t) = \\sigma'(t) = \\sigma(t)(1 - \\sigma(t)) = q(1 - q)\\). So \\(\\ell(z;q) \\approx \\ell(t;q) + \\tfrac{1}{2}q(1-q)(z - t)^2\\)."
            },
            {
                front: "Write the weighted least squares interpretation of LR on soft labels.",
                back: "\\(\\min_{w,b}\\; \\E[\\omega(x)(w^\\top\\phi(x) + b - t(x))^2]\\) with \\(\\omega(x) = q(x)(1 - q(x))\\) and \\(t(x) = \\logit(q(x))\\). LR is weighted regression of teacher logits onto features."
            },
            {
                front: "Interpret the weight function \\(\\omega(q) = q(1-q)\\) in SGD terms.",
                back: "Maximized at \\(q = 1/2\\) (\\(\\omega = 0.25\\)): uncertain teacher predictions matter most. Vanishes at \\(q \\in \\{0, 1\\}\\): confident predictions have extreme logits that are hard to match precisely, and cross-entropy automatically downweights them."
            },
            {
                front: "When does LR to soft labels reduce to ordinary least squares on logits?",
                back: "When \\(\\omega(x) = q(x)(1 - q(x))\\) is approximately constant — i.e., when soft labels lie away from 0 and 1. Constant weights cancel out, leaving \\(\\min \\E[(w^\\top\\phi + b - t)^2]\\)."
            },
            {
                front: "Write the normal equations for the OLS problem and state their geometric meaning.",
                back: "\\(\\E[\\tilde\\phi\\tilde\\phi^\\top]\\tilde w = \\E[t\\tilde\\phi]\\). Geometrically: the residual \\(t(x) - \\tilde w^\\top\\tilde\\phi(x)\\) is orthogonal to every feature in the \\(L^2\\) inner product — the optimum is an <strong>orthogonal projection</strong>."
            },
            {
                front: "State the Hilbert-space interpretation of logistic regression on soft labels.",
                back: "The teacher's logit function \\(t(x)\\) lives in the Hilbert space \\(L^2\\) (inner product \\(\\langle a,b\\rangle = \\E[a(x)b(x)]\\)). The LR solution is the orthogonal projection of \\(t\\) onto the finite-dimensional subspace spanned by the features \\(\\tilde\\phi_j\\)."
            },
            {
                front: "List the four steps of the full interpretability story, from teacher probabilities to weights.",
                back: "(1) Teacher gives soft probabilities \\(q(x)\\). (2) Cross-entropy locally becomes regression on logits \\(t(x) = \\logit(q(x))\\). (3) Solution is orthogonal projection of \\(t\\) onto feature span. (4) Weight vector \\(w\\) encodes projection coefficients — partial derivatives of the linear approximation to the teacher's log-odds."
            },
            {
                front: "Summarize the linear-probe procedure in 4 steps.",
                back: "(1) Extract representation \\(h_\\ell(x)\\) at a chosen layer. (2) Freeze all network parameters. (3) Fit \\(P(y=1\\mid x) = \\sigma(w^\\top h_\\ell(x) + b)\\). (4) Interpret weights: large \\(|w_j|\\) = dimension \\(j\\) strongly encodes the label; odds multiplied by \\(e^{w_j}\\) per unit increase."
            },
            {
                front: "How do comparative linear probes across layers reveal network behavior?",
                back: "Probe accuracy that rises from layer 3 to layer 6 indicates the network is making the property progressively more linearly accessible. If it decreases in later layers, the network may be discarding that information as irrelevant to the final task."
            },
            {
                front: "Name two limitations of linear probes.",
                back: "(1) They detect only <strong>linear</strong> encoding — nonlinearly encoded properties go undetected. (2) In high dimensions, a probe can achieve nontrivial accuracy on spurious signal, so accuracy should be compared against a random-feature baseline."
            },
            {
                front: "Why is it a problem to try to match teacher <em>probabilities</em> directly instead of logits?",
                back: "Probabilities live in the bounded interval \\((0, 1)\\) and saturate. Confident teacher predictions (near 0 or 1) give extreme logits that are hard to match, but the cross-entropy naturally down-weights them via \\(\\omega = q(1-q)\\). Matching probabilities linearly would misspecify the objective."
            },
            {
                front: "How is a surrogate model (LIME-style) related to logistic regression?",
                back: "A surrogate fits a simple, interpretable model (e.g. LR) to approximate \\(p_w(x) \\approx p_f(x)\\) locally or globally. The surrogate's weights serve as a linear explanation of the black box's behavior in that region."
            },
            {
                front: "Why does LR remain the default model in medicine, economics, and social science?",
                back: "Because every coefficient \\(w_j\\) has a precise, quantitative meaning — the log-odds derivative and odds multiplier \\(e^{w_j}\\). Interpretability matters more than marginal accuracy improvements for decisions requiring accountability."
            },
            {
                front: "Given teacher logit \\(t(x)\\) and student logit \\(z(x) = w^\\top\\phi(x)\\), what drives the loss?",
                back: "Near the optimum, loss \\(\\approx \\frac{1}{2}\\omega(x)(z(x) - t(x))^2\\). The student is minimizing weighted squared error in logit space, with uncertain-teacher points weighted most heavily."
            },
            {
                front: "What happens to the weight function \\(\\omega(q)\\) at \\(q = 0.01\\)?",
                back: "\\(\\omega(0.01) = 0.01 \\cdot 0.99 \\approx 0.01\\) — very small. The curvature of cross-entropy at that point is tiny, so fitting errors at near-certain teacher predictions contribute little to the loss. Uncertain points dominate."
            }
        ];

        var currentIndex = 0;
        var deck = cards.map(function(_, i) { return i; });

        var savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.body.classList.add('dark');
        }
        updateArticleLink();

        function toggleTheme() {
            var isDark = document.body.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                document.body.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateArticleLink();
        }

        function updateArticleLink() {
            var isDark = document.body.classList.contains('dark');
            var theme = isDark ? 'dark' : 'light';
            document.querySelectorAll('.article-link').forEach(function(link) {
                var article = link.getAttribute('data-article');
                link.href = article + '-' + theme + '.html';
            });
        }

        function renderCard() {
            var card = cards[deck[currentIndex]];
            document.getElementById('frontText').innerHTML = card.front;
            document.getElementById('backText').innerHTML = card.back;
            document.getElementById('cardCounter').textContent = 'Card ' + (currentIndex + 1) + ' of ' + deck.length;
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === deck.length - 1;

            document.getElementById('flashcard').classList.remove('is-flipped');

            if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('frontText'), document.getElementById('backText')]).catch(function(err) {
                    console.log('MathJax typeset error:', err);
                });
            }
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('is-flipped');
            if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('backText')]).catch(function(err) {
                    console.log('MathJax typeset error:', err);
                });
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function nextCard() {
            if (currentIndex < deck.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function shuffleDeck() {
            for (var i = deck.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = deck[i];
                deck[i] = deck[j];
                deck[j] = temp;
            }
            currentIndex = 0;
            renderCard();
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                prevCard();
            } else if (e.key === 'ArrowRight') {
                nextCard();
            } else if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });

        renderCard();
    </script>
</body>
</html>
