<body>
    <div class="header-container">
        <h1>Sigmoid Neurons and Logistic Regression &mdash; Flashcards</h1>
        <div class="theme-toggle">
            <span class="toggle-label">Theme</span>
            <div class="toggle-switch" onclick="toggleTheme()">
                <div class="toggle-slider"></div>
            </div>
        </div>
    </div>

    <a href="sigmoid_neurons-light.html" class="back-link article-link" data-article="sigmoid_neurons">&larr; Back to article</a>

    <div class="card-counter" id="cardCounter">Card 1 of 25</div>

    <div class="flashcard-scene" id="flashcardScene" onclick="flipCard()">
        <div class="flashcard" id="flashcard">
            <div class="flashcard-face flashcard-front">
                <div class="face-label">Question</div>
                <div class="card-text" id="frontText"></div>
                <div class="tap-hint">Click to reveal answer</div>
            </div>
            <div class="flashcard-face flashcard-back">
                <div class="face-label">Answer</div>
                <div class="card-text" id="backText"></div>
                <div class="tap-hint">Click to see question</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="prevCard()">&larr; Previous</button>
        <button class="shuffle-btn" onclick="shuffleDeck()">Shuffle</button>
        <button id="nextBtn" onclick="nextCard()">Next &rarr;</button>
    </div>

    <footer>
        <p>Stephen Fitz &middot; 2026</p>
    </footer>

    <script>
        var cards = [
            {
                front: "What two limitations of the perceptron does the sigmoid neuron resolve?",
                back: "(1) The sign function is discontinuous and has no usable gradient. (2) The perceptron outputs a hard \\(\\pm 1\\) decision, not a probability. The sigmoid is smooth everywhere and produces outputs in \\((0,1)\\) interpretable as probabilities."
            },
            {
                front: "Define the sigmoid function and state its range.",
                back: "\\(\\sigma(z) = \\frac{1}{1 + e^{-z}} = \\frac{e^z}{e^z + 1}\\). Range: \\((0, 1)\\) for all real \\(z\\), with \\(\\sigma(0) = 1/2\\) and \\(\\lim_{z\\to\\pm\\infty}\\sigma(z) \\in \\{0,1\\}\\)."
            },
            {
                front: "State and prove the symmetry property of the sigmoid.",
                back: "\\(\\sigma(-z) = 1 - \\sigma(z)\\). Proof: \\(\\sigma(-z) = 1/(1+e^z) = e^{-z}/(e^{-z}+1) = 1 - 1/(1+e^{-z})\\)."
            },
            {
                front: "What is the derivative of the sigmoid, and where is it largest?",
                back: "\\(\\sigma'(z) = \\sigma(z)(1 - \\sigma(z))\\). It attains its maximum \\(1/4\\) at \\(z = 0\\), where \\(\\sigma(0) = 1/2\\). It decays symmetrically toward 0 as \\(|z| \\to \\infty\\) (saturation)."
            },
            {
                front: "How does a sigmoid neuron model \\(P(y=1 \\mid x)\\)?",
                back: "\\(\\hat{y} = P(y=1 \\mid x) = \\sigma(w^\\top x)\\). Each label is modeled as a Bernoulli: \\(y^{(i)} \\sim \\text{Bernoulli}(\\sigma(w^\\top x^{(i)}))\\), turning classification into probabilistic inference."
            },
            {
                front: "Write the per-example Bernoulli probability using \\(y \\in \\{0,1\\}\\) in a single expression.",
                back: "\\(p_i = \\sigma(w^\\top x^{(i)})^{y^{(i)}} \\cdot (1 - \\sigma(w^\\top x^{(i)}))^{1 - y^{(i)}}\\). It collapses to \\(\\sigma\\) when \\(y=1\\) and to \\(1-\\sigma\\) when \\(y=0\\)."
            },
            {
                front: "What is Maximum Likelihood Estimation (MLE) for logistic regression?",
                back: "Find \\(w\\) maximizing \\(P(D \\mid w) = \\prod_i p_i\\) — the probability that the model assigns to the observed labels. Equivalently, minimize the negative log-likelihood \\(-\\log P(D \\mid w)\\)."
            },
            {
                front: "Derive the binary cross-entropy loss from MLE.",
                back: "\\(\\mathcal{L}(w) = -\\log\\prod_i p_i = -\\sum_i [y^{(i)} \\log\\sigma(w^\\top x^{(i)}) + (1-y^{(i)})\\log(1-\\sigma(w^\\top x^{(i)}))]\\). Cross-entropy is a consequence, not a design choice."
            },
            {
                front: "What does the term \\(-\\log p_i\\) represent in information theory?",
                back: "The <strong>surprisal</strong> (self-information) of observing the correct label under the model. Minimizing total surprisal means finding the model least surprised by the data."
            },
            {
                front: "Why does confident wrong prediction get punished so severely?",
                back: "The cross-entropy loss grows logarithmically: as \\(\\hat{y} \\to 0\\) when \\(y=1\\), \\(L = -\\log\\hat{y} \\to \\infty\\). A model that assigns probability 0.01 to an event that actually occurs is very surprised indeed."
            },
            {
                front: "Why not use quadratic (MSE) loss with the sigmoid?",
                back: "Quadratic loss composed with sigmoid is <strong>non-convex</strong> in \\(w\\): there are local minima and flat regions, and gradient descent can get stuck. Cross-entropy, by contrast, is convex in \\(w\\)."
            },
            {
                front: "State the gradient of the cross-entropy loss in elementwise form.",
                back: "\\(\\frac{\\partial \\mathcal{L}}{\\partial w} = \\sum_{i=1}^n x^{(i)}(\\sigma(w^\\top x^{(i)}) - y^{(i)})\\) — the sum over examples of input vectors scaled by the prediction error \\((\\hat{y} - y)\\)."
            },
            {
                front: "State the gradient of the cross-entropy loss in matrix form.",
                back: "\\(\\frac{\\partial \\mathcal{L}}{\\partial w} = X^\\top(\\sigma(Xw) - y)\\). The design matrix transposed times the vector of prediction errors."
            },
            {
                front: "Write the gradient descent update rule for logistic regression.",
                back: "\\(w \\leftarrow w - \\eta \\cdot X^\\top(\\sigma(Xw) - y)\\), where \\(\\eta > 0\\) is the learning rate."
            },
            {
                front: "How does the sigmoid neuron's update differ from the perceptron's?",
                back: "Perceptron updates only on mistakes with fixed scale \\(\\pm 1\\). Sigmoid updates on <em>all</em> examples, scaled by the prediction error \\((\\hat{y} - y)\\): small updates for confident correct predictions, large updates for confident wrong ones."
            },
            {
                front: "Define the logit function and its relationship to the sigmoid.",
                back: "\\(\\logit(p) = \\log\\frac{p}{1-p} = \\sigma^{-1}(p)\\). It maps probabilities in \\((0,1)\\) back to the real line. The quantity \\(p/(1-p)\\) is the <strong>odds</strong> of the event."
            },
            {
                front: "Why are logistic regression weights so interpretable?",
                back: "The log-odds are linear in \\(x\\): \\(\\log\\frac{P(y=1)}{P(y=0)} = w^\\top x\\). Each \\(w_j\\) is the partial derivative of the log-odds with respect to feature \\(x_j\\). A unit increase in \\(x_j\\) multiplies the odds by \\(e^{w_j}\\)."
            },
            {
                front: "Interpret a logistic regression weight of \\(w_j = 0.5\\).",
                back: "A unit increase in feature \\(x_j\\) multiplies the odds of the positive class by \\(e^{0.5} \\approx 1.65\\) — a 65% increase in odds, holding all other features fixed."
            },
            {
                front: "Prove the cross-entropy loss is convex in \\(w\\).",
                back: "For a single example with logit \\(z = w^\\top x\\), \\(L(z,y) = \\log(1+e^z) - yz\\). Then \\(L''(z) = \\sigma'(z) = \\sigma(z)(1-\\sigma(z)) > 0\\). So \\(L\\) is convex in \\(z\\), hence in \\(w\\) (linear in \\(w\\)). Sum of convex functions is convex."
            },
            {
                front: "Why does convexity of the cross-entropy loss matter?",
                back: "Gradient descent is guaranteed to find the <strong>global</strong> minimum — there are no local minima or saddle points to trap the optimizer. The perceptron guarantees convergence only on separable data; quadratic+sigmoid loses convexity entirely."
            },
            {
                front: "Show that minimizing cross-entropy equals minimizing KL divergence.",
                back: "\\(H(q, p) = H(q) + D_{\\mathrm{KL}}(q \\| p) \\geq H(q)\\). Since \\(H(q)\\) is fixed by the data, minimizing cross-entropy is equivalent to minimizing \\(D_{\\mathrm{KL}}(q \\| p)\\) — finding the model closest to the true label distribution."
            },
            {
                front: "What is a linear probe?",
                back: "Logistic regression fitted on top of a frozen representation \\(h(x)\\) (from a word embedding, hidden layer, or LLM activation): \\(P(y=1 \\mid x) = \\sigma(w^\\top h(x) + b)\\). Probe weights reveal which directions in representation space encode the label."
            },
            {
                front: "Prove that log-odds are linear in the input for logistic regression.",
                back: "\\(\\sigma(z)/(1-\\sigma(z)) = e^z\\) (check: substitute). So \\(\\log\\frac{\\sigma(w^\\top x)}{1 - \\sigma(w^\\top x)} = w^\\top x\\) — linear in \\(x\\)."
            },
            {
                front: "Why is the sigmoid's derivative, \\(\\sigma(z)(1-\\sigma(z))\\), convenient for backprop?",
                back: "It is expressible purely in terms of the forward-pass output \\(a = \\sigma(z)\\): just compute \\(a(1-a)\\). No need to recompute \\(\\sigma\\); no extra exponentials."
            },
            {
                front: "What three lines of code implement one full training step of logistic regression?",
                back: "(1) <code>y_hat = sigmoid(X @ w)</code> &mdash; forward; (2) <code>gradient = X.T @ (y_hat - y)</code> &mdash; gradient; (3) <code>w = w - lr * gradient</code> &mdash; update."
            }
        ];

        var currentIndex = 0;
        var deck = cards.map(function(_, i) { return i; });

        var savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.body.classList.add('dark');
        }
        updateArticleLink();

        function toggleTheme() {
            var isDark = document.body.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                document.body.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateArticleLink();
        }

        function updateArticleLink() {
            var isDark = document.body.classList.contains('dark');
            var theme = isDark ? 'dark' : 'light';
            document.querySelectorAll('.article-link').forEach(function(link) {
                var article = link.getAttribute('data-article');
                link.href = article + '-' + theme + '.html';
            });
        }

        function renderCard() {
            var card = cards[deck[currentIndex]];
            document.getElementById('frontText').innerHTML = card.front;
            document.getElementById('backText').innerHTML = card.back;
            document.getElementById('cardCounter').textContent = 'Card ' + (currentIndex + 1) + ' of ' + deck.length;
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === deck.length - 1;

            document.getElementById('flashcard').classList.remove('is-flipped');

            if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('frontText'), document.getElementById('backText')]).catch(function(err) {
                    console.log('MathJax typeset error:', err);
                });
            }
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('is-flipped');
            if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('backText')]).catch(function(err) {
                    console.log('MathJax typeset error:', err);
                });
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function nextCard() {
            if (currentIndex < deck.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function shuffleDeck() {
            for (var i = deck.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = deck[i];
                deck[i] = deck[j];
                deck[j] = temp;
            }
            currentIndex = 0;
            renderCard();
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                prevCard();
            } else if (e.key === 'ArrowRight') {
                nextCard();
            } else if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });

        renderCard();
    </script>
</body>
</html>
