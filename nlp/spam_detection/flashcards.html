    <style>

        .controls button:hover {

        .shuffle-btn {

        @media (max-width: 700px) {
            body {
                padding: 2em 1.5em;

            }

            h1 {
                font-size: 18pt;
            }

            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }

            .flashcard-scene {
                min-height: 300px;
            }

            .flashcard {
                min-height: 300px;
            }

            .flashcard-face {
                min-height: 300px;
                padding: 2em 1.5em;
            }

            .flashcard-front .card-text {

            .controls button {

    </style>
</head>
<body>
    <div class="header-container">
        <h1>SMS Spam Detection with a Sigmoid Neuron &mdash; Flashcards</h1>
        <div class="theme-toggle">
            <span class="toggle-label">Theme</span>
            <div class="toggle-switch" onclick="toggleTheme()">
                <div class="toggle-slider"></div>
            </div>
        </div>
    </div>

    <a href="spam_detection-light.html" class="back-link article-link" data-article="spam_detection">&larr; Back to article</a>

    <div class="card-counter" id="cardCounter">Card 1 of 25</div>

    <div class="flashcard-scene" id="flashcardScene" onclick="flipCard()">
        <div class="flashcard" id="flashcard">
            <div class="flashcard-face flashcard-front">
                <div class="face-label">Question</div>
                <div class="card-text" id="frontText"></div>
                <div class="tap-hint">Click to reveal answer</div>
            </div>
            <div class="flashcard-face flashcard-back">
                <div class="face-label">Answer</div>
                <div class="card-text" id="backText"></div>
                <div class="tap-hint">Click to see question</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="prevCard()">&larr; Previous</button>
        <button class="shuffle-btn" onclick="shuffleDeck()">Shuffle</button>
        <button id="nextBtn" onclick="nextCard()">Next &rarr;</button>
    </div>

    <footer>
        <p>Stephen Fitz &middot; 2026</p>
    </footer>

    <script>
        var cards = [
            {
                front: "How is SMS spam detection framed as probabilistic binary classification?",
                back: "Given a message \\(m\\) with binary feature vector \\(x \\in \\{0,1\\}^V\\), estimate \\(P(\\text{spam} \\mid m) = \\sigma(w^\\top x)\\). Classify as spam when the probability exceeds a threshold \\(\\tau\\) (often 0.5)."
            },
            {
                front: "Why is a probability output preferable to the perceptron's hard decision for spam filtering?",
                back: "A probability expresses confidence: 0.97 is \"almost certainly spam\"; 0.51 is \"barely spam\". The filter can defer uncertain cases to the user rather than silently deleting legitimate messages."
            },
            {
                front: "Describe the four-step NLP pipeline that turns raw SMS text into a feature vector.",
                back: "(1) Tokenize with <code>re.findall(r'[a-z0-9]+', text.lower())</code>; (2) remove stopwords; (3) build a vocabulary from training messages (keep words with frequency \\(\\geq 2\\)); (4) convert each message to a binary bag-of-words vector plus a bias term."
            },
            {
                front: "Why remove stopwords like \"the\", \"is\", \"of\"?",
                back: "They appear in nearly every message and carry little discriminative information. Removing them reduces noise and shrinks the vocabulary without losing signal."
            },
            {
                front: "Why impose a minimum-frequency threshold (e.g. \\(\\geq 2\\)) when building the vocabulary?",
                back: "Words appearing in only one message are unreliable indicators — the model could memorize them and overfit. The threshold prunes such low-evidence features."
            },
            {
                front: "What does the binary bag-of-words representation discard, and what does it keep?",
                back: "Keeps: which vocabulary words are present. Discards: word order and frequency. \"free prize\" and \"prize free\" get identical vectors; one \"free\" and ten \"free\"s look the same."
            },
            {
                front: "What is the shape of the feature matrix for 90 training messages and a 119-word vocabulary?",
                back: "\\(90 \\times 120\\): 90 rows (messages) times \\(119\\) vocabulary features + 1 bias column."
            },
            {
                front: "Why does the sigmoid implementation use <code>np.clip(z, -500, 500)</code>?",
                back: "To prevent numerical overflow in <code>np.exp(-z)</code>. Without clipping, very large negative \\(z\\) produces \\(e^{500} \\approx 10^{217}\\), which exceeds floating-point range."
            },
            {
                front: "What is the initial cross-entropy loss when weights are zero?",
                back: "With \\(w = 0\\), every prediction is \\(\\sigma(0) = 0.5\\), so \\(\\mathcal{L}(0) = -\\log 0.5 = \\log 2 \\approx 0.693\\). This is the loss of a model that assigns equal probability to spam and ham."
            },
            {
                front: "Write the batch gradient descent update rule for the SMS spam classifier.",
                back: "\\(w \\leftarrow w - \\eta \\cdot \\frac{1}{m} X^\\top(\\sigma(Xw) - y)\\), where \\(m\\) is the batch size, \\(\\eta\\) the learning rate."
            },
            {
                front: "What trade-off does the learning rate \\(\\eta\\) control?",
                back: "Too small: convergence is slow, the model barely learns. Too large: updates overshoot the minimum and may oscillate or diverge. \\(\\eta = 1.0\\) was a good balance on this dataset."
            },
            {
                front: "What is the odds multiplier of a word with weight \\(w_j = 3.53\\) (e.g. \"free\")?",
                back: "\\(e^{3.53} \\approx 34\\). Adding \"free\" to a message multiplies the odds of spam by a factor of 34, holding all other words fixed."
            },
            {
                front: "If a message without the word \"free\" has even odds (50/50) of being spam, what happens when \"free\" is added?",
                back: "The odds shift to \\(34:1\\) in favor of spam, corresponding to \\(P(\\text{spam}) = 34/35 \\approx 0.97\\)."
            },
            {
                front: "What does the learned bias term \\(b = -2.04\\) represent?",
                back: "The model's prior: with no words present (empty feature vector), log-odds are \\(-2.04\\), giving \\(\\sigma(-2.04) \\approx 0.12\\). The model starts skeptical that any message is spam."
            },
            {
                front: "How do the strongest ham-indicator words (\"can\", \"earlier\", \"morning\") differ from spam indicators?",
                back: "They have large <strong>negative</strong> weights. Each one <em>divides</em> the spam odds (e.g. \"can\" with \\(w = -1.07\\) divides odds by \\(\\sim 3\\times\\)). They come from the vocabulary of everyday coordination."
            },
            {
                front: "What tradeoff does the decision threshold \\(\\tau\\) control?",
                back: "Raising \\(\\tau\\) reduces false positives (higher precision) but increases false negatives (lower recall); lowering \\(\\tau\\) catches more spam but risks filtering legitimate messages. The perceptron cannot tune this."
            },
            {
                front: "An email provider wants to never block a legitimate message. What threshold should they pick?",
                back: "A high threshold (e.g. \\(\\tau = 0.9\\)): only messages the model is very confident about are filtered. This accepts more false negatives (spam in inbox) but minimizes false positives."
            },
            {
                front: "Why does batch gradient descent produce a smooth, monotonic loss curve on this problem?",
                back: "Because the cross-entropy loss is <strong>convex</strong> in \\(w\\) when composed with the sigmoid. Every gradient step strictly decreases the loss; there are no local minima to cause oscillation."
            },
            {
                front: "What fundamental ambiguity is invisible to a bag-of-words classifier?",
                back: "Meaning that depends on word order: \"not spam\" and \"spam not\" yield identical feature vectors. Any negation, scoping, or compositional meaning is lost."
            },
            {
                front: "Why can't a bag-of-words sigmoid neuron learn that \"free\" is spammy only when combined with \"call\"?",
                back: "The log-odds model is purely <strong>additive</strong>: \\(\\log\\text{odds} = \\sum w_j x_j + b\\). Each word's contribution is independent of what else appears. Feature interactions require nonlinear models (hidden layers)."
            },
            {
                front: "How could a spammer exploit a known bag-of-words model?",
                back: "Craft messages that avoid high-weight spam words while including high-weight ham words — e.g. \"Can you please check your morning schedule\" + phishing link. The model would assign low spam probability because it cannot read the link itself."
            },
            {
                front: "Why are obfuscated spellings like \"fr33\" or \"w1n\" problematic for this classifier?",
                back: "They are out-of-vocabulary tokens. The model assigns them zero weight, so they contribute nothing to the spam score — precisely the evasion spammers want."
            },
            {
                front: "What is the \"calibration\" advantage of the sigmoid neuron over the perceptron?",
                back: "Its outputs can be read as genuine probabilities — \\(P = 0.97\\) really corresponds to ~97% confidence. This enables thresholding, deferral to humans, combining with other signals, and principled decision-making under cost asymmetry."
            },
            {
                front: "What does the precision-recall curve flat near \\(\\tau \\in [0.15, 0.50]\\) tell us about the test set?",
                back: "There is clean separation: no test messages fall near the decision boundary. Many thresholds give perfect accuracy. On noisier real-world data, the curve would bend and the tradeoff would be central."
            },
            {
                front: "Why does the sigmoid neuron achieve 100% test accuracy on this dataset?",
                back: "The spam/ham vocabularies are quite distinct (urgency/reward trigger words vs. everyday coordination). Logistic regression on binary word features captures nearly all of the signal, and the two classes are linearly separable in feature space."
            }
        ];

        var currentIndex = 0;
        var deck = cards.map(function(_, i) { return i; });

        var savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.body.classList.add('dark');
        }
        updateArticleLink();

        function toggleTheme() {
            var isDark = document.body.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                document.body.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateArticleLink();
        }

        function updateArticleLink() {
            var isDark = document.body.classList.contains('dark');
            var theme = isDark ? 'dark' : 'light';
            document.querySelectorAll('.article-link').forEach(function(link) {
                var article = link.getAttribute('data-article');
                link.href = article + '-' + theme + '.html';
            });
        }

        function renderCard() {
            var card = cards[deck[currentIndex]];
            document.getElementById('frontText').innerHTML = card.front;
            document.getElementById('backText').innerHTML = card.back;
            document.getElementById('cardCounter').textContent = 'Card ' + (currentIndex + 1) + ' of ' + deck.length;
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === deck.length - 1;

            document.getElementById('flashcard').classList.remove('is-flipped');

            if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('frontText'), document.getElementById('backText')]).catch(function(err) {
                    console.log('MathJax typeset error:', err);
                });
            }
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('is-flipped');
            if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('backText')]).catch(function(err) {
                    console.log('MathJax typeset error:', err);
                });
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function nextCard() {
            if (currentIndex < deck.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function shuffleDeck() {
            for (var i = deck.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = deck[i];
                deck[i] = deck[j];
                deck[j] = temp;
            }
            currentIndex = 0;
            renderCard();
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                prevCard();
            } else if (e.key === 'ArrowRight') {
                nextCard();
            } else if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });

        renderCard();
    </script>
</body>
</html>
