    <script>
        // Flashcard data
        var cards = [
            {
                front: "What is a recurrent neural network (RNN)?",
                back: "A neural network that processes sequences one element at a time, maintaining a hidden state \\(h_t\\) that accumulates information from all previous elements. The recurrence gives the network access, in principle, to the entire input history. RNNs dominated NLP from roughly 2013 to 2017."
            },
            {
                front: "What is the vanilla RNN recurrence relation?",
                back: "\\(h_t = \\phi(W_h h_{t-1} + W_x x_t + b)\\), where \\(W_h \\in \\mathbb{R}^{n\\times n}\\) is the recurrent weight matrix, \\(W_x \\in \\mathbb{R}^{n\\times d}\\) is the input weight matrix, \\(b\\) is a bias, and \\(\\phi\\) is typically \\(\\tanh\\). \\(h_0\\) is usually initialized to zero."
            },
            {
                front: "What does it mean to unroll an RNN through time?",
                back: "Creating one copy of the network per time step and connecting them through the hidden state. The result is a deep feedforward graph whose depth equals sequence length, but with all copies sharing the same weights \\(W_h, W_x, b\\). This weight sharing keeps the parameter count at \\(n^2 + nd + n\\) regardless of \\(T\\)."
            },
            {
                front: "What is backpropagation through time (BPTT)?",
                back: "The training algorithm for RNNs: unroll the network for the full sequence, sum per-step losses \\(\\mathcal{L} = \\sum_t \\mathcal{L}_t\\), and backpropagate gradients through the unrolled graph. Each \\(\\partial \\mathcal{L}_t / \\partial W_h\\) requires applying the chain rule back through the recurrence from step \\(t\\) to step 1."
            },
            {
                front: "What is the vanishing gradient problem in RNNs?",
                back: "The Jacobian product \\(\\partial h_T / \\partial h_t = \\prod_{k=t+1}^{T} W_h^\\top \\operatorname{diag}(\\phi'(z_k))\\) shrinks exponentially when \\(\\|W_h\\| < 1\\) and \\(|\\phi'| \\le 1\\) (as with tanh). Gradient signals from distant time steps decay to zero, making vanilla RNNs unable to learn long-range dependencies."
            },
            {
                front: "What is the exploding gradient problem, and how is it addressed?",
                back: "When \\(\\|W_h\\| > 1\\) the Jacobian product grows exponentially, causing numerical instability. Fix: gradient clipping (Pascanu et al., 2013) \u2014 rescale \\(g \\leftarrow (\\theta / \\|g\\|)\\, g\\) whenever \\(\\|g\\| > \\theta\\). Vanishing gradients, by contrast, require an architectural solution (gated cells)."
            },
            {
                front: "What is the key architectural innovation of an LSTM?",
                back: "A separate cell state \\(c_t\\) that acts as an additive memory highway: \\(c_t = f_t \\odot c_{t-1} + i_t \\odot \\tilde{c}_t\\). Information flows across time steps unattenuated because the update is an addition rather than a matrix multiply + nonlinearity. Learned gates control what is erased, written, and exposed."
            },
            {
                front: "Name the four quantities an LSTM cell computes at each step.",
                back: "(1) Forget gate \\(f_t = \\sigma(W_f [h_{t-1}; x_t] + b_f)\\): what to erase. (2) Input gate \\(i_t\\): what to write. (3) Candidate cell state \\(\\tilde{c}_t = \\tanh(W_c [h_{t-1}; x_t] + b_c)\\): new content proposal. (4) Output gate \\(o_t\\): what to expose. Gates use sigmoids so outputs lie in \\((0,1)\\)."
            },
            {
                front: "Write the LSTM cell-state and hidden-state updates.",
                back: "\\(c_t = f_t \\odot c_{t-1} + i_t \\odot \\tilde{c}_t\\) and \\(h_t = o_t \\odot \\tanh(c_t)\\). The cell state is updated by forgetting then adding; the hidden state is a gated, squashed view of the cell state. \\(\\odot\\) is element-wise multiplication."
            },
            {
                front: "Why does an LSTM solve the vanishing gradient problem?",
                back: "\\(\\partial c_T / \\partial c_t = \\prod_{k=t+1}^{T} f_k\\). When forget gates are near 1, this product stays near 1 regardless of \\(T - t\\), so gradients flow through the cell-state addition without being attenuated by a weight matrix or a saturating nonlinearity. The network <em>learns</em> when to preserve information."
            },
            {
                front: "How many parameters does an LSTM have relative to a vanilla RNN?",
                back: "Roughly \\(4\\times\\): \\(4n(n + d + 1)\\) for the LSTM vs. \\(n^2 + nd + n\\) for the vanilla RNN. The factor of 4 is the cost of having four weight matrices for the forget gate, input gate, candidate, and output gate."
            },
            {
                front: "What are the two gates in a GRU, and what do they do?",
                back: "Update gate \\(z_t\\): interpolates between old hidden state and candidate. Reset gate \\(r_t\\): controls how much of \\(h_{t-1}\\) the candidate sees, via \\(\\tilde{h}_t = \\tanh(W_h [r_t \\odot h_{t-1}; x_t] + b_h)\\). The update gate plays the role of both the LSTM's forget and input gates."
            },
            {
                front: "Write the GRU hidden-state update.",
                back: "\\(h_t = (1 - z_t) \\odot h_{t-1} + z_t \\odot \\tilde{h}_t\\). A linear interpolation: \\(z_t \\approx 0\\) copies the old state forward unchanged, \\(z_t \\approx 1\\) replaces it with the candidate. There is no separate cell state \u2014 hidden state and memory are merged."
            },
            {
                front: "How do GRUs and LSTMs compare in practice?",
                back: "Comparable performance on most tasks. GRU has three weight matrices (~75% of LSTM parameters) and is preferred when data is limited or efficiency matters. LSTM is preferred when the task benefits from fine-grained control over long-term memory via the separate cell state."
            },
            {
                front: "What are the four common RNN input-output configurations?",
                back: "(1) One-to-many (e.g., image captioning). (2) Many-to-one (e.g., sentiment classification). (3) Many-to-many aligned (e.g., POS tagging, language modeling). (4) Many-to-many unaligned (e.g., machine translation via encoder\u2013decoder)."
            },
            {
                front: "What is a bidirectional RNN?",
                back: "Two separate RNNs \u2014 a forward one reading left-to-right and a backward one reading right-to-left \u2014 whose hidden states are concatenated at each position: \\(h_t = [\\overrightarrow{h}_t ; \\overleftarrow{h}_t] \\in \\mathbb{R}^{2n}\\). Each position sees full sequence context. Cannot be used for autoregressive language modeling."
            },
            {
                front: "What is the encoder\u2013decoder (seq2seq) architecture?",
                back: "Two-stage model for sequence-to-sequence tasks (Sutskever et al. 2014; Cho et al. 2014). Encoder: a (typically bidirectional) RNN compresses the source into a fixed-size context vector \\(c = h_S^e\\). Decoder: an autoregressive RNN initialized with \\(c\\) generates the target one token at a time."
            },
            {
                front: "What is teacher forcing, and what is its drawback?",
                back: "A training trick: feed the ground-truth previous token \\(y_{t-1}^*\\) to the decoder at each step instead of the model's own prediction. Gives a stable training signal and allows decoder steps to be computed given the target. Drawback: <strong>exposure bias</strong> \u2014 the model never sees its own errors at training time. Scheduled sampling (Bengio et al., 2015) mitigates this."
            },
            {
                front: "What is the information bottleneck in the basic encoder\u2013decoder?",
                back: "The entire source sentence must be compressed into a single fixed-size context vector \\(c\\). Cho et al. (2014) observed that translation quality degraded sharply for sentences longer than about 20 tokens, because \\(c\\) cannot faithfully represent all the information the decoder needs. This motivated attention."
            },
            {
                front: "What does the attention mechanism compute at each decoder step?",
                back: "(1) Alignment scores \\(e_{tj} = a(s_{t-1}, h_j^e)\\) between decoder state and each encoder state. (2) Attention weights \\(\\alpha_{tj} = \\operatorname{softmax}(e_{tj})\\). (3) Context vector \\(c_t = \\sum_j \\alpha_{tj} h_j^e\\) \u2014 a weighted average of encoder states. (4) Updated decoder state \\(s_t\\) conditioned on \\(c_t\\)."
            },
            {
                front: "What is the difference between Bahdanau and Luong attention?",
                back: "Bahdanau (additive, 2015): \\(e_{tj} = v^\\top \\tanh(W_s s_{t-1} + W_h h_j^e)\\) \u2014 a small feedforward network. Luong (multiplicative, 2015): \\(e_{tj} = s_t^\\top W_a h_j^e\\) or \\(s_t^\\top h_j^e\\) \u2014 cheaper, a single matrix product. Multiplicative attention became the default and underlies Transformer self-attention."
            },
            {
                front: "How does attention eliminate the bottleneck?",
                back: "The decoder computes a <em>different</em> \\(c_t\\) at each step by attending to all encoder states, so it is no longer restricted to a single fixed-size vector. This also gives an \\(O(1)\\) path length between any decoder step and any encoder step, and exposes interpretable alignment weights."
            },
            {
                front: "What is a stacked (deep) RNN?",
                back: "Multiple recurrent layers stacked vertically: \\(h_t^{(\\ell)} = \\text{RNN}^{(\\ell)}(h_t^{(\\ell-1)}, h_{t-1}^{(\\ell)})\\). Each layer learns a more abstract representation. 2\u20134 layers are typical for RNN encoders/decoders; Google's NMT system (Wu et al., 2016) used 8-layer LSTMs."
            },
            {
                front: "What is variational dropout in RNNs?",
                back: "Standard dropout disrupts recurrent dynamics when applied at every step. Gal and Ghahramani (2016) proposed sampling a <em>single</em> dropout mask at the start of the sequence and reusing it at every time step. This is equivalent to approximate Bayesian inference over the recurrent weights and preserves temporal correlations."
            },
            {
                front: "What is ELMo, and what problem does it solve?",
                back: "Embeddings from Language Models (Peters et al., 2018). Solves context-insensitivity of static embeddings like Word2Vec \u2014 the word \u201cbank\u201d gets the same vector in \u201criver bank\u201d and \u201cbank account.\u201d ELMo extracts context-dependent word representations from a pretrained deep biLSTM language model."
            },
            {
                front: "How are ELMo representations computed?",
                back: "A task-specific weighted sum across biLSTM layers: \\(\\text{ELMo}_t = \\gamma \\sum_{\\ell=0}^{L} s_\\ell\\, h_t^{(\\ell)}\\), with softmax-normalized scalar weights \\(s_\\ell\\) and a scaling factor \\(\\gamma\\). The base biLSTM is frozen after pretraining; only \\(s_\\ell\\) and \\(\\gamma\\) are learned for each downstream task."
            },
            {
                front: "What does each layer of ELMo capture?",
                back: "Layer 0 (character CNN): context-free morphological/orthographic features. Layer 1 (first biLSTM): syntactic features \u2014 POS, syntactic role. Layer 2 (second biLSTM): semantic features \u2014 word sense, discourse role. This stratification is why the task-specific weighted combination across layers works better than using just the top layer."
            },
            {
                front: "Why were RNNs superseded by Transformers?",
                back: "(1) Sequential computation: \\(h_t\\) depends on \\(h_{t-1}\\), preventing parallelism \u2014 training is \\(O(T)\\) per layer regardless of hardware. (2) Long-range dependencies: even LSTMs struggle past hundreds of tokens due to \\(T - t\\) multiplicative interactions. (3) Fixed-dimensional decoder bottleneck. Transformers solve all three via self-attention."
            }
        ];

        var currentIndex = 0;
        var deck = cards.map(function(_, i) { return i; });

        // Theme management
        var savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.body.classList.add('dark');
        }
        updateArticleLink();

        function toggleTheme() {
            var isDark = document.body.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                document.body.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateArticleLink();
        }

        function updateArticleLink() {
            var isDark = document.body.classList.contains('dark');
            var theme = isDark ? 'dark' : 'light';
            document.querySelectorAll('.article-link').forEach(function(link) {
                var article = link.getAttribute('data-article');
                link.href = article + '-' + theme + '.html';
            });
        }

        // Card rendering
        function renderCard() {
            var card = cards[deck[currentIndex]];
            document.getElementById('frontText').innerHTML = card.front;
            document.getElementById('backText').innerHTML = card.back;
            document.getElementById('cardCounter').textContent = 'Card ' + (currentIndex + 1) + ' of ' + deck.length;
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === deck.length - 1;

            // Reset flip
            document.getElementById('flashcard').classList.remove('is-flipped');

            // Typeset MathJax
            if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('frontText'), document.getElementById('backText')]).catch(function(err) {
                    console.log('MathJax typeset error:', err);
                });
            }
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('is-flipped');
            // Re-render MathJax on flip to ensure back side renders
            if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('backText')]).catch(function(err) {
                    console.log('MathJax typeset error:', err);
                });
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function nextCard() {
            if (currentIndex < deck.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function shuffleDeck() {
            // Fisher-Yates shuffle
            for (var i = deck.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = deck[i];
                deck[i] = deck[j];
                deck[j] = temp;
            }
            currentIndex = 0;
            renderCard();
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                prevCard();
            } else if (e.key === 'ArrowRight') {
                nextCard();
            } else if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });

        // Initial render
        renderCard();
    </script>
</body>
</html>
