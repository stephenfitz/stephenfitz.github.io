<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stphnftz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #2E3440;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: #ECEFF4;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: lowercase;
      color: #D8DEE9;
      margin-bottom: 3.5rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      min-width: 340px;
    }

    .links a {
      display: block;
      padding: 1.4rem 4rem;
      border: 1px solid #4C566A;
      border-radius: 10px;
      color: #D8DEE9;
      text-decoration: none;
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }

    .links a:hover {
      background-color: #3B4252;
      border-color: #81A1C1;
      color: #ECEFF4;
    }

    @media (max-width: 480px) {
      .links a {
        padding: 1rem 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>stphnftz</h1>
    <div class="links">
      <a href="https://www.instagram.com/stphnftz" target="_blank" rel="noopener">instagram</a>
      <a href="https://x.com/stphnftz" target="_blank" rel="noopener">x</a>
      <a href="https://substack.com/@stphnftz" target="_blank" rel="noopener">substack</a>
    </div>
  </div>
</body>
</html>
