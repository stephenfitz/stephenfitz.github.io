<!DOCTYPE html>
<html lang="en" >

  <head>

    <meta charset="UTF-8">
    <title>algorithms</title>
    <script src="../common/js/modernizr.min.js" type="text/javascript"></script>
    <link rel="stylesheet" href="../common/css/reset.min.css">
    <link rel="icon" type="image/x-icon" href="../common/media/logo.png">
    
    <style>

      @charset "UTF-8";

      @font-face {
        font-family: 'Pacifico';
        font-style: normal;
        font-weight: 400;
        src: local('Pacifico Regular'), local('Pacifico-Regular'), url(fonts/pacifico) format('woff2');
      }
      @font-face {
        font-family: 'Roboto';
        font-style: normal;
        font-weight: 700;
        src: local('Roboto Bold'), local('Roboto-Bold'), url(fonts/roboto) format('woff2');
      }
      @font-face {
        font-family: 'Kaushan Script';
        font-style: normal;
        font-weight: 400;
        src: local('Kaushan Script'), local('KaushanScript-Regular'), url(fonts/kaushan_script) format('woff2');
      }

      body {
        min-height: 450px;
        height: 100vh;
        margin: 0;
        background: radial-gradient(circle, #666666, #444444, #222222, #000000);
      }

      .stage {
        height: 300px;
        width: 500px;
        margin: auto;
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        perspective: 9999px;
        transform-style: preserve-3d;
      }

      .layer {
        width: 100%;
        height: 100%;
        position: absolute;
        transform-style: preserve-3d;
        animation: ಠ_ಠ 5s infinite alternate ease-in-out -7.5s;
        animation-fill-mode: forwards;
        transform: rotateY(40deg) rotateX(33deg) translateZ(0);
      }

      .layer:after {
  font: 120px/1.0 'Segoe UI', 'Helvetica Neue', 'Trebuchet MS', Verdana, sans-serif;
        content: 'advanced\A algorithms';
        white-space: pre;
        text-align: center;
        height: 100%;
        width: 100%;
        position: absolute;
        top: 50px;
        color: whitesmoke;
        letter-spacing: -2px;
        text-shadow: 4px 0 10px rgba(0, 0, 0, 0.13);
      }

      .layer:nth-child(1):after {
        transform: translateZ(0px);
      }

      .layer:nth-child(2):after {
        transform: translateZ(-1.5px);
      }

      .layer:nth-child(3):after {
        transform: translateZ(-3px);
      }

      .layer:nth-child(4):after {
        transform: translateZ(-4.5px);
      }

      .layer:nth-child(5):after {
        transform: translateZ(-6px);
      }

      .layer:nth-child(6):after {
        transform: translateZ(-7.5px);
      }

      .layer:nth-child(7):after {
        transform: translateZ(-9px);
      }

      .layer:nth-child(8):after {
        transform: translateZ(-10.5px);
      }

      .layer:nth-child(9):after {
        transform: translateZ(-12px);
      }

      .layer:nth-child(10):after {
        transform: translateZ(-13.5px);
      }

      .layer:nth-child(11):after {
        transform: translateZ(-15px);
      }

      .layer:nth-child(12):after {
        transform: translateZ(-16.5px);
      }

      .layer:nth-child(13):after {
        transform: translateZ(-18px);
      }

      .layer:nth-child(14):after {
        transform: translateZ(-19.5px);
      }

      .layer:nth-child(15):after {
        transform: translateZ(-21px);
      }

      .layer:nth-child(16):after {
        transform: translateZ(-22.5px);
      }

      .layer:nth-child(17):after {
        transform: translateZ(-24px);
      }

      .layer:nth-child(18):after {
        transform: translateZ(-25.5px);
      }

      .layer:nth-child(19):after {
        transform: translateZ(-27px);
      }

      .layer:nth-child(20):after {
        transform: translateZ(-28.5px);
      }

      .layer:nth-child(n+10):after {
        -webkit-text-stroke: 3px rgba(0, 0, 0, 0.25);
      }

      .layer:nth-child(n+11):after {
        -webkit-text-stroke: 15px #444;
        text-shadow: 6px 0 6px #222, 5px 5px 5px #111, 0 6px 6px #222;
      }

      .layer:nth-child(n+12):after {
        -webkit-text-stroke: 15px #666;
      }

      .layer:last-child:after {
        -webkit-text-stroke: 17px rgba(0, 0, 0, 0.1);
      }

      .layer:first-child:after {
        color: #fff;
        text-shadow: none;
      }

      @keyframes ಠ_ಠ {
        100% {
          transform: rotateY(-40deg) rotateX(-43deg);
        }
      }

    </style>

    <script src="../js/prefixfree.min.js"></script>

  </head>

</html>
